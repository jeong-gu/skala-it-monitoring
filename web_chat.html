<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>운영 에이전트 채팅 (Vue)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #1e1e2e; color: #e2e2f0;
    overflow: hidden;   /* #log만 스크롤되게, 바디 자체는 늘어나지 않게 고정 */
  }
  #app {
    flex: 1; min-height: 0;   /* Vue 마운트 루트가 header/#log/form을 감싸므로,
                                 body의 flex 흐름이 여기까지 이어지게 한다 */
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: #262638; border-bottom: 1px solid #3a3a52;
    font-weight: 600; font-size: 15px;
  }
  header span { color: #8b8bd8; font-weight: 400; font-size: 13px; margin-left: 8px; }
  #log {
    flex: 1; min-height: 0;   /* flex 자식 기본 최소높이(콘텐츠 크기)를 풀어줘야
                                 내용이 길어져도 바디가 안 늘어나고 여기서만 스크롤됨 */
    overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #3a3a52; border-radius: 6px; }
  #log::-webkit-scrollbar-thumb:hover { background: #4a4a68; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 14px; white-space: pre-wrap;
  }
  .row.user .bubble { background: #5b5bd6; color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: #2e2e42; border-bottom-left-radius: 4px; }
  .steps {
    max-width: 70%; font-size: 12px; color: #9a9ac0; padding: 6px 14px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .steps .step::before { content: "⏳ "; }
  .steps .step.done::before { content: "✓ "; color: #7ee787; }
  .prompt-box {
    flex-shrink: 0;   /* #log가 스크롤 영역이 되면서(min-height:0) <details>가 flex
                         자식으로서 내용 없이 찌그러지는 걸 방지 */
    max-width: 70%; margin-top: -4px; background: #17171f; border: 1px solid #3a3a52;
    border-radius: 10px; font-size: 12px; overflow: hidden;
  }
  .prompt-box summary {
    cursor: pointer; padding: 7px 12px; color: #8b8bd8; user-select: none;
    list-style: none;
  }
  .prompt-box summary::-webkit-details-marker { display: none; }
  .prompt-box summary::before { content: "🔍 "; }
  .prompt-box[open] summary::before { content: "🔽 "; }
  .prompt-box pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid #3a3a52;
    background: #11111a; color: #c3c3e0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; max-height: 320px; overflow-y: auto;
  }
  form { display: flex; gap: 8px; padding: 14px 20px; background: #262638; border-top: 1px solid #3a3a52; }
  input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #3a3a52;
    background: #1e1e2e; color: #e2e2f0; font-size: 14px;
  }
  input:focus { outline: 1px solid #5b5bd6; }
  button {
    padding: 11px 20px; border-radius: 10px; border: none; background: #5b5bd6;
    color: white; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #3a3a52; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>운영 인시던트 대응 에이전트 <span>{{ backendLabel }}</span></header>
  <div id="log" ref="logEl">
    <template v-for="item in log" :key="item.id">
      <div v-if="item.kind === 'user'" class="row user">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'steps'" class="steps">
        <div v-for="(step, i) in item.steps" :key="i" class="step">{{ step }}</div>
      </div>

      <div v-else-if="item.kind === 'agent'" class="row agent">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <details v-else-if="item.kind === 'investigation' && item.tasks.length" class="prompt-box" open>
        <summary>조사 Task와 확인 정보</summary>
        <div v-for="task in item.tasks" :key="task.task_id" style="padding:10px 12px;border-top:1px solid #3a3a52">
          <strong>{{ task.server_id }} · {{ task.goal }}</strong>
          <div v-for="(status, id) in task.information_status" :key="id">
            {{ task.information_labels?.[id] || id }}: {{ statusLabel(status) }}
          </div>
          <div>조회 계획: {{ task.command_ids.join(', ') || '미지원 또는 계획 대기' }}</div>
        </div>
      </details>

      <details v-else-if="item.kind === 'requirements' && item.requirements.length" class="prompt-box" open>
        <summary>요청 충족 확인 · {{ item.validation?.status === 'passed' ? '충족 확인' : item.validation?.status === 'unverified' ? '검증 미완료' : '확인 중·미충족 포함' }}</summary>
        <div v-for="r in item.requirements" :key="r.requirement_id" style="padding:10px 12px;border-top:1px solid #3a3a52">
          <strong>{{ r.description }}</strong>
          <div>{{ statusLabel(r.status) }} · {{ r.reason }}</div>
          <details><summary>확인 이력</summary><div v-for="(h, i) in r.history" :key="i">{{ statusLabel(h.status) }}: {{ h.reason }}</div></details>
        </div>
        <details v-if="item.issues.length"><summary>중간에 확인된 미충족 사항</summary>
          <div v-for="g in item.issues" :key="g.issue_id" style="padding:6px 12px">{{ g.resolved ? '해결' : '기록' }} · {{ g.reason }}</div>
        </details>
      </details>

      <div v-else-if="item.kind === 'evidence'">
        <details v-for="e in item.evidence" :key="e.evidence_id" class="prompt-box" style="margin:6px 0">
          <summary>{{ e.evidence_id }} · {{ e.server_id }} · {{ e.command }} · 원문 근거</summary>
          <pre>{{ JSON.stringify(e, null, 2) }}</pre>
        </details>
      </div>

      <details v-else-if="item.kind === 'prompt'" class="prompt-box">
        <summary>LLM에 전달된 최종 프롬프트 보기</summary>
        <pre>{{ item.text }}</pre>
      </details>
    </template>
  </div>
  <form @submit.prevent="onSubmit">
    <input
      v-model="input"
      autocomplete="off"
      placeholder="예: 서버 B가 느린데 원인을 확인해줘 / 서버 G 메모리 상태는 어때?"
    />
    <button type="submit" :disabled="sending">보내기</button>
  </form>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, nextTick } = Vue;

const STEP_LABELS = {
  RequirementsIdentified: e => `조사 대상 확인: ${e.targets.join(', ')}`,
  CommandSelected: e => `${e.server_id}: ${e.command} 선택 (${e.information_ids.join(', ')})`,
  FinalAnswerValidation: e => e.status === 'passed' ? '원래 요청에 대한 답변 충족 확인' : '최종 검토: 미충족·확인 불가 항목 확인',
  AnswerRepair: e => `부족한 정보·설명 보완 (${e.attempt}회)`,
  InvestigationReview: e => `결과 검토 후 추가 Task ${e.additional_task_count}개 계획`,
  CommandCompleted: e => `${e.server_id}: ${e.command} 조회 완료 (종료 코드 ${e.exit_code})`,
  PlanCreated: e => `계획 수립: 할 일 ${e.task_count}가지${e.targets?.length ? ` (시스템: ${e.targets.join(', ')})` : ''}`,
  GateApplied: e => e.removed_analysis_tasks ? `불필요한 작업 ${e.removed_analysis_tasks}건 제거` : null,
  TaskCompleted: e => (e.source === 'monitoring'
      ? `모니터링 지표 확인 (시스템: ${e.target})`
      : `대응 매뉴얼(runbook) 조회 (장애유형: ${e.target})`) + (e.retries ? ' (재시도 성공)' : ''),
  ReplanCheck: e => e.is_sufficient ? null : `정보 부족 → 장애유형 "${e.target}"로 추가 조사`,
  DraftWritten: e => `답변 초안 작성 (시도 ${e.attempt})`,
  Validation: e => e.verdict === '합격' ? '검수 통과' : '검수 반려 → 다시 작성',
  Finalize: () => '최종 답변 완성',
};

createApp({
  setup() {
    const backendLabel = ref('all_total_vue');
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0;
    const statusLabel = status => ({pending:'미조회',obtained:'정보 확보',needs_more:'추가 확인 필요',failed:'조회 실패',unsupported:'미지원',information_ready:'정보 확보·답변 확인 대기',satisfied:'답변 충족'}[status] || status);

    fetch('/health').then(r => r.json()).then(h => {
      backendLabel.value = `${h.llm_backend} 실모델(${h.fast_llm}/${h.quality_llm}) · all_total_vue`;
    }).catch(() => {});

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text) return;

      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      scrollToBottom();

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      const tasksItem = reactive({ id: nextId++, kind: 'investigation', tasks: [] });
      log.value.push(tasksItem);
      const requirementsItem = reactive({id:nextId++,kind:'requirements',requirements:[],issues:[],validation:null});
      log.value.push(requirementsItem);
      scrollToBottom();

      const url = `/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`;
      const es = new EventSource(url);
      let streamItem = null;
      let streamAttempt = null;   // write_node 재작성(attempt 증가) 시 새 말풍선으로 끊는다
      let gotFinal = false;

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { es.close(); sending.value = false; return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'RequestRequirements') {
          requirementsItem.requirements = e.requirements;
          requirementsItem.issues = e.requirement_issues;
          scrollToBottom();
          return;
        }
        if (e.type === 'FinalAnswerValidation') requirementsItem.validation = e;
        if (e.type === 'InvestigationTasks') {
          tasksItem.tasks = e.tasks;
          scrollToBottom();
          return;
        }

        if (e.type === 'AnswerToken') {
          if (!streamItem || streamAttempt !== e.attempt) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
            streamAttempt = e.attempt;
          }
          streamItem.text += e.delta;
          scrollToBottom();
          return;
        }

        if (e.type === 'FinalAnswer') {
          gotFinal = true;
          if (e.requirements) requirementsItem.requirements = e.requirements;
          if (e.requirement_issues) requirementsItem.issues = e.requirement_issues;
          if (e.final_validation) requirementsItem.validation = e.final_validation;
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text = e.reply;   // 토큰 합산 결과와 서버의 최종 텍스트를 일치시킨다
          if (e.tasks?.some(t => t.information_ids)) tasksItem.tasks = e.tasks;
          if (e.evidence?.length) log.value.push({ id: nextId++, kind: 'evidence', evidence: e.evidence });
          if (e.prompt) log.value.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null;
          streamAttempt = null;
          scrollToBottom();
          return;
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        stepsItem.steps.push(label);
        scrollToBottom();
      };

      es.onerror = () => {
        es.close(); sending.value = false;
        if (!gotFinal) log.value.push({id:nextId++,kind:'agent',text:'연결이 끊어져 조사를 완료하지 못했습니다. 완료되지 않은 결과는 정상 상태로 판단하지 않습니다.'});
      };
    }

    return { backendLabel, log, input, sending, logEl, onSubmit, statusLabel };
  },
}).mount('#app');
</script>
</body>
</html>
